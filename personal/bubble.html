<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Strike-Through Practice</title>
    <style>
        
        li {
            font-size: 20px;
            margin: 10px 0;
            cursor: pointer;
        }

        /* The class you will apply using JavaScript */
        .strike {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <!-- We put the ID on the parent UL for event bubbling -->
    <ul id="nav-list">
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
    </ul>

    <script src="bubble.js"></script>
</body>
</html>
