<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Generator Practice</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { 
            border: 1px solid #ccc; 
            padding: 15px; 
            border-radius: 8px; 
            width: 200px; 
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        #cards-container { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
    </style>
</head>
<body>

    <div id="main">
        <h2>Create a User Card</h2>
        <form id="user-form">
            <input type="text" id="pic" placeholder="Profile Pic URL">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="occupation" placeholder="Occupation">
            <input type="text" id="info" placeholder="Info">
            <button type="submit">Create Card</button>
        </form>

        <!-- Your generated cards will be placed inside this div -->
        <div id="cards-container"></div>
    </div>

    <script src="Event_Card.js"></script>
</body>
</html>
