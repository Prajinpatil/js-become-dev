<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Manager</title>
    <link rel="stylesheet" href="adduser.css">
</head>
<body>

    <div class="container">
        <h2>User Management System</h2>
        
        <!-- Input Form -->
        <form id="user-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="role" placeholder="Role (e.g. Developer)" required>
            <input type="text" id="bio" placeholder="Bio" required>
            <input type="text" id="photo" placeholder="Photo Image URL" required>
            <button type="submit">Add User</button>
        </form>

        <!-- Dynamic User Cards Container -->
        <div class="users">
            <!-- User cards will be rendered here dynamically -->
        </div>
    </div>

    <script src="adduser.js"></script>
</body>
</html>
